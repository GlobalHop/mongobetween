services:
  mongo1:
    image: "mongo:8.0"
  mongo2:
    image: "mongo:8.0"
  mongo3:
    image: "mongo:8.0"

  rs1: &rs
    image: "mongo:8.0"
    command: ["--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ping:1}).ok"]
      interval: 3s
      timeout: 5s
      retries: 20
  rs2:
    <<: *rs
  rs3:
    <<: *rs

  rs-init:
    image: "mongo:8.0"
    restart: "no"
    depends_on:
      rs1:
        condition: service_healthy
      rs2:
        condition: service_healthy
      rs3:
        condition: service_healthy
    entrypoint:
      - mongosh
      - --quiet
      - --host
      - rs1
      - --eval
      - |
        try {
          rs.status();
        } catch (e) {
          rs.initiate({_id: "rs0", members: [
            {_id: 0, host: "rs1:27017"},
            {_id: 1, host: "rs2:27017"},
            {_id: 2, host: "rs3:27017"},
          ]});
        }
        const deadline = Date.now() + 60000;
        while (Date.now() < deadline) {
          for (const host of ["rs1", "rs2", "rs3"]) {
            try {
              const h = new Mongo(host + ":27017").getDB("admin").hello();
              if (h.isWritablePrimary) {
                print("replica set ready, primary " + host);
                quit(0);
              }
            } catch (e) {}
          }
          sleep(1000);
        }
        print("timed out waiting for primary");
        quit(1);

  # --- PHP / libmongoc smoke test (profile "php"; see scripts/php-smoke.sh) ---
  mongobetween: &proxy
    profiles: ["php"]
    build: .
    command:
      - -ping
      - -loglevel
      - info
      - ":27016=mongodb://rs1:27017,rs2:27017,rs3:27017/?replicaSet=rs0&serverSelectionTimeoutMS=15000"
    depends_on:
      rs-init:
        condition: service_completed_successfully

  mongobetween-secure:
    <<: *proxy
    command:
      - -ping
      - -loglevel
      - info
      - -auth-users-file
      - /certs/users.txt
      - -tls-cert-file
      - /certs/server.pem
      - -tls-key-file
      - /certs/server.key
      - ":27017=mongodb://rs1:27017,rs2:27017,rs3:27017/?replicaSet=rs0&serverSelectionTimeoutMS=15000"
    volumes:
      - "${SMOKE_CERTS_DIR:-./.smoke-certs}:/certs:ro"

  php-smoke:
    profiles: ["php"]
    build:
      context: test/php
    depends_on:
      - mongobetween
      - mongobetween-secure
    environment:
      SMOKE_PROXY_PASSWORD: "${SMOKE_PROXY_PASSWORD:-}"
    volumes:
      - "${SMOKE_CERTS_DIR:-./.smoke-certs}:/certs:ro"
